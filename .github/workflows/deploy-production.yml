# FluxMedia 生产部署流水线（手动）。
#
# 使用方式：在 GitHub Actions 手动运行，输入已由 Release 流水线发布的版本号。
# 本流水线不构建镜像：它从公开 GitHub Release 下载并校验部署包，经 SSH 上传到服务器，
# 调用包内 apply-release.sh 执行与站内超管“系统更新”完全相同的发布逻辑。
# 两条入口通过服务器上的 release-state/deploy.lock 互斥。运行时配置只保存在目标服务器。
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已发布的版本号，例如 v0.8.1 或 v0.9.0-rc.1"
        required: true
        type: string

# 同一生产环境只允许一个部署运行；保留已开始的部署，避免中途取消留下半更新状态。
concurrency:
  group: fluxmedia-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_APP_URL: https://media.flux-code.cc

jobs:
  deploy:
    name: Migrate database and deploy unified application with Docker Compose
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ inputs.version }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/fluxmedia' }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    steps:
      - name: Checkout release download scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: deploy

      - name: Download and verify release bundle
        id: bundle
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/release"
          manifest_values="$(
            bash deploy/fetch-release-bundle.sh "${VERSION}" "${release_dir}"
          )"
          manifest_value() {
            printf '%s\n' "${manifest_values}" | awk -F= -v key="$1" '$1 == key { print $2 }'
          }
          {
            echo "BUNDLE_DIR=${release_dir}/bundle"
            echo "APP_IMAGE=$(manifest_value APP_IMAGE)"
            echo "APP_DIGEST=$(manifest_value APP_DIGEST)"
            echo "GIT_SHA=$(manifest_value GIT_SHA)"
          } >> "${GITHUB_ENV}"

      - name: Configure SSH
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/root/fluxmedia}"

          if [[ ! "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::DEPLOY_PORT 必须是有效端口号。"
            exit 1
          fi
          port_number=$((10#${DEPLOY_PORT}))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "::error::DEPLOY_PORT 必须位于 1 到 65535。"
            exit 1
          fi
          if [[ ! "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH 必须是不含空格的绝对路径。"
            exit 1
          fi
          if [ -n "${GHCR_PAT}" ] && [[ ! "${GHCR_USERNAME}" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::GHCR_USERNAME 必须是有效的 GitHub 用户名。"
            exit 1
          fi
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends sshpass
          fi

          {
            echo "DEPLOY_PORT=${DEPLOY_PORT}"
            echo "DEPLOY_PATH=${DEPLOY_PATH}"
            echo "REMOTE_BUNDLE_DIR=${DEPLOY_PATH}/incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_ENV}"

      - name: Upload release bundle
        run: |
          set -euo pipefail
          SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 750 '${DEPLOY_PATH}' && install -d -m 700 '${DEPLOY_PATH}/incoming' '${REMOTE_BUNDLE_DIR}'"
          SSHPASS="${DEPLOY_PASSWORD}" sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P "${DEPLOY_PORT}" \
            "${BUNDLE_DIR}"/* \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_BUNDLE_DIR}/"

      - name: Login target host to GHCR
        run: |
          set -euo pipefail
          # GHCR 包公开时无需登录；私有包需要 GHCR_PAT（read:packages）。
          if [ -z "${GHCR_PAT}" ]; then
            echo "未配置 GHCR_PAT，按公开镜像匿名拉取。"
            exit 0
          fi
          printf '%s' "${GHCR_PAT}" | SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"

      - name: Deploy and verify unified application
        id: deploy
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          trap 'rm -f "${result_file}"' EXIT

          set +e
          SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash '${REMOTE_BUNDLE_DIR}/apply-release.sh' --deploy-path '${DEPLOY_PATH}' --bundle-dir '${REMOTE_BUNDLE_DIR}' </dev/null" \
            | tee "${result_file}"
          ssh_status="${PIPESTATUS[0]}"
          set -e
          if [ "${ssh_status}" -ne 0 ]; then
            exit "${ssh_status}"
          fi

          # 从远程输出提取最后一个同名安全证据值。
          extract_evidence() {
            key="$1"
            awk -v key="${key}" '
              index($0, key "=") == 1 {
                value = substr($0, length(key) + 2)
              }
              END { print value }
            ' "${result_file}"
          }

          relay_count="$(extract_evidence relay_only_true_count)"
          backup_storage="$(extract_evidence backup_storage)"
          backup_artifact_id="$(extract_evidence backup_artifact_id)"
          backup_artifact_sha256="$(
            extract_evidence backup_artifact_sha256
          )"
          backup_delete_after="$(extract_evidence backup_delete_after)"
          backup_archive_manifest_verified="$(
            extract_evidence backup_archive_manifest_verified
          )"
          backup_storage_verified="$(
            extract_evidence backup_storage_verified
          )"
          deployment_completed="$(extract_evidence deployment_completed)"
          deployed_image_ref="$(extract_evidence deployed_image_ref)"
          previous_release="$(extract_evidence previous_release)"
          nginx_config_backup="$(extract_evidence nginx_config_backup)"
          if [ "${relay_count}" != "0" ] \
            || { [ "${backup_storage}" != "local" ] \
              && [ "${backup_storage}" != "s3" ]; } \
            || [ -z "${backup_artifact_id}" ] \
            || [[ ! "${backup_artifact_sha256}" =~ ^[a-f0-9]{64}$ ]] \
            || [ -z "${backup_delete_after}" ] \
            || [ "${backup_archive_manifest_verified}" != "true" ] \
            || [ "${backup_storage_verified}" != "true" ] \
            || [ -z "${nginx_config_backup}" ] \
            || [ "${deployed_image_ref}" != "${APP_IMAGE}@${APP_DIGEST}" ] \
            || [ "${deployment_completed}" != "true" ]; then
            echo "::error::部署完成但安全证据不完整。"
            exit 1
          fi

          {
            echo "relay_count=${relay_count}"
            echo "backup_storage=${backup_storage}"
            echo "backup_artifact_id=${backup_artifact_id}"
            echo "backup_artifact_sha256=${backup_artifact_sha256}"
            echo "backup_delete_after=${backup_delete_after}"
            printf 'backup_archive_manifest_verified=%s\n' \
              "${backup_archive_manifest_verified}"
            printf 'backup_storage_verified=%s\n' \
              "${backup_storage_verified}"
            echo "deployed_image_ref=${deployed_image_ref}"
            echo "previous_release=${previous_release}"
            echo "nginx_config_backup=${nginx_config_backup}"
          } >> "${GITHUB_OUTPUT}"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## FluxMedia 生产部署"
            echo ""
            echo "- 统一应用镜像：\`${{ steps.deploy.outputs.deployed_image_ref }}\`"
            echo "- 域名：\`${PUBLIC_APP_URL}\`"
            echo "- 版本：\`${VERSION}\`（提交 \`${GIT_SHA}\`）"
            echo "- 迁移前版本：\`${{ steps.deploy.outputs.previous_release }}\`"
            echo "- 容器：\`app\`（Next.js、Go、QuickJS、Sharp/ONNX）"
            echo "- Nginx 配置备份：\`${{ steps.deploy.outputs.nginx_config_backup }}\`"
            echo "- 纯中转预检：\`${{ steps.deploy.outputs.relay_count }}\`"
            echo "- 备份存储：\`${{ steps.deploy.outputs.backup_storage }}\`"
            echo "- 备份 artifact：\`${{ steps.deploy.outputs.backup_artifact_id }}\`"
            echo "- 备份 artifact SHA-256：\`${{ steps.deploy.outputs.backup_artifact_sha256 }}\`"
            echo "- 备份销毁截止：\`${{ steps.deploy.outputs.backup_delete_after }}\`"
            echo "- archive manifest 校验：" \
              "\`${{ steps.deploy.outputs.backup_archive_manifest_verified }}\`"
            echo "- 最终存储摘要校验：" \
              "\`${{ steps.deploy.outputs.backup_storage_verified }}\`"
            echo "- 操作者：\`${GITHUB_ACTOR}\`"
            echo "- 回滚边界：迁移后失败保持维护状态，不自动启动旧镜像"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove uploaded release bundle
        if: always()
        run: |
          if [ -z "${REMOTE_BUNDLE_DIR:-}" ]; then
            exit 0
          fi
          SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "rm -rf '${REMOTE_BUNDLE_DIR}'" || true
