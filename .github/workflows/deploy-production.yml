# FluxMedia 生产部署流水线。
#
# 使用方式：从 main 或与输入版本一致的 Git tag 手动触发。流水线先执行质量门，
# 再构建 web 与 migrate 镜像并推送 GHCR，最后通过 SSH 账号密码同步生产 Compose、迁移数据库并更新 web 服务。
# 真实运行时配置只保存在目标服务器 deploy/.env，不进入仓库或 Actions 日志。
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v0.8.1 或 v0.9.0-rc.1"
        required: true
        type: string
      skip_deploy:
        description: "只构建并推送镜像，不部署到服务器"
        required: false
        default: false
        type: boolean

# 同一生产环境只允许一个部署运行；保留已开始的部署，避免中途取消留下半更新状态。
concurrency:
  group: fluxmedia-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fluxmedia-web
  PUBLIC_APP_URL: https://media.flux-code.cc

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fluxmedia_moderation_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluxmedia_moderation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2

      - name: Validate branch and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::版本号必须符合 v<MAJOR>.<MINOR>.<PATCH>[-<alpha|beta|rc>.<N>]。"
            exit 1
          fi

          expected_tag_ref="refs/tags/${VERSION}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${GITHUB_REF}" != "${expected_tag_ref}" ]; then
            echo "::error::生产部署只能从 main 或与版本号一致的 Git tag 触发。"
            exit 1
          fi

      - uses: ./.github/actions/setup

      - name: Test media upstream proxy
        working-directory: services/media-upstream-proxy
        run: go test ./...

      - name: Assert documentation mirror
        run: diff -q --strip-trailing-cr CLAUDE.md AGENTS.md

      - name: Test deployment environment parser
        run: bash deploy/read-env-value.test.sh

      - name: Test release ledger digest parser
        run: bash deploy/read-release-ledger-digest.test.sh

      - name: Test deployment database backup
        run: bash deploy/create-database-backup.test.sh

      - name: Test deployment release recovery policy
        run: bash deploy/release-recovery-policy.test.sh

      - name: Generate Fumadocs source
        run: pnpm --filter @repo/web exec fumadocs-mdx

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      - name: Migrate moderation integration database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
        run: pnpm --filter @repo/database db:migrate

      - name: Test generation time migration with PostgreSQL
        env:
          GENERATION_TIME_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
        run: pnpm --filter @repo/integration-tests test:generation-time-migration

      - name: Test moderation with PostgreSQL
        env:
          MODERATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
        run: pnpm --filter @repo/integration-tests test:moderation

      - name: Test release governance gates with PostgreSQL
        env:
          RELEASE_GATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
        run: pnpm --filter @repo/integration-tests test:release-governance

      - name: Test unified media pool with PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
          IMAGE_BACKEND_POOL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
          MEDIA_BACKEND_POOL_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
          MEDIA_GENERATION_FINANCIAL_RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
          VIDEO_GENERATION_RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
        run: |
          set -euo pipefail
          pnpm --filter @repo/integration-tests test:image-backend-pool
          pnpm --filter @repo/integration-tests test:media-generation-financial-recovery
          pnpm --filter @repo/integration-tests test:video-generation-recovery
          pnpm --filter @repo/integration-tests test:media-backend-pool-migration

      - name: Test media task queue with Redis
        env:
          MEDIA_TASK_MQ_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: pnpm --filter @repo/integration-tests test:media-task-mq

      - name: Verify release database gates
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
        run: |
          set -euo pipefail
          pnpm --filter @repo/database db:release-gate -- drain
          pnpm --filter @repo/database db:release-gate -- preflight-early
          VIDEO_INPUT_ROLLBACK_MANIFEST=/tmp/video-input-rollback.ndjson \
            node apps/web/scripts/migrate-video-input-assets.mjs migrate \
            --confirm-no-legacy-writers
          release_preflight="$(
            # 门禁失败时仍需把非敏感聚合证据写入 Actions 日志，供阻塞报告定位。
            pnpm --filter @repo/database db:release-gate -- preflight \
              | tee /dev/stderr
          )"
          release_credits_ledger_digest="$(
            printf '%s\n' "${release_preflight}" \
              | bash deploy/read-release-ledger-digest.sh
          )"
          RELEASE_CREDITS_LEDGER_DIGEST="${release_credits_ledger_digest}" \
            pnpm --filter @repo/database db:release-gate -- postcheck-initial

      - name: Build web
        env:
          BETTER_AUTH_SECRET: build-time-placeholder-secret-not-for-runtime
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_moderation_test
          NEXT_PUBLIC_APP_NAME: FluxMedia
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SYSTEM_ASSETS_BUCKET_NAME: system
          GENERATIONS_BUCKET_NAME: generations
          NEXT_PUBLIC_PAYMENT_PROVIDER: none
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          pnpm --filter @repo/web build
          pnpm --filter @repo/web assert:api-upstream-worker-standalone
          pnpm --filter @repo/web smoke:api-upstream-worker

  build-and-push:
    name: Build and push web, migrate, and proxy images
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
      migrate_image: ${{ steps.meta.outputs.migrate_image }}
      proxy_image: ${{ steps.meta.outputs.proxy_image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve image metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "web_image=${REGISTRY}/${owner_lower}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "migrate_image=${REGISTRY}/${owner_lower}/fluxmedia-migrate" >> "${GITHUB_OUTPUT}"
          echo "proxy_image=${REGISTRY}/${owner_lower}/fluxmedia-media-upstream-proxy" >> "${GITHUB_OUTPUT}"
          echo "tag=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web_image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=FluxMedia
            NEXT_PUBLIC_PAYMENT_PROVIDER=none
            BETTER_AUTH_URL=${{ env.PUBLIC_APP_URL }}
          cache-from: type=gha,scope=fluxmedia-web
          cache-to: type=gha,mode=max,scope=fluxmedia-web

      - name: Build and push migrate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.migrate_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.migrate_image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=fluxmedia-migrate
          cache-to: type=gha,mode=max,scope=fluxmedia-migrate

      - name: Build and push media upstream proxy image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.media-upstream-proxy
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.proxy_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.proxy_image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=fluxmedia-media-upstream-proxy
          cache-to: type=gha,mode=max,scope=fluxmedia-media-upstream-proxy

  deploy:
    name: Migrate database and deploy web with Docker Compose
    needs: build-and-push
    if: ${{ inputs.skip_deploy == false }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
      MIGRATE_IMAGE: ${{ needs.build-and-push.outputs.migrate_image }}
      PROXY_IMAGE: ${{ needs.build-and-push.outputs.proxy_image }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: deploy

      - name: Configure SSH
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          : "${GHCR_USERNAME:?GHCR_USERNAME variable or workflow actor is required}"
          : "${GHCR_PAT:?GHCR_PAT secret is required}"

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/root/flux-media}"

          if [[ ! "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::DEPLOY_PORT 必须是有效端口号。"
            exit 1
          fi
          port_number=$((10#${DEPLOY_PORT}))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "::error::DEPLOY_PORT 必须位于 1 到 65535。"
            exit 1
          fi
          if [[ ! "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH 必须是不含空格的绝对路径。"
            exit 1
          fi
          if [[ ! "${GHCR_USERNAME}" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::GHCR_USERNAME 必须是有效的 GitHub 用户名。"
            exit 1
          fi
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends sshpass
          fi

          {
            echo "DEPLOY_PORT=${DEPLOY_PORT}"
            echo "DEPLOY_PATH=${DEPLOY_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Synchronize deployment files
        run: |
          set -euo pipefail
          SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 750 '${DEPLOY_PATH}'"
          SSHPASS="${DEPLOY_PASSWORD}" sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P "${DEPLOY_PORT}" \
            deploy/docker-compose.yml \
            deploy/create-database-backup.sh \
            deploy/read-release-ledger-digest.sh \
            deploy/release-recovery-policy.sh \
            deploy/read-env-value.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Login target host to GHCR
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_PAT}" | SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"

      - name: Deploy and verify web service
        id: deploy
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          trap 'rm -f "${result_file}"' EXIT

          set +e
          SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- \
              "${WEB_IMAGE}" \
              "${MIGRATE_IMAGE}" \
              "${PROXY_IMAGE}" \
              "${IMAGE_TAG}" \
              "${DEPLOY_PATH}" \
              "${GITHUB_SHA}" <<'REMOTE_SCRIPT' | tee "${result_file}"
          set -euo pipefail

          web_image="$1"
          migrate_image="$2"
          proxy_image="$3"
          image_tag="$4"
          deploy_path="$5"
          git_sha="$6"
          cd "${deploy_path}"

          if [ ! -f .env ]; then
            echo "目标服务器缺少 ${deploy_path}/.env，请先从 deploy/.env.example 创建并填写。" >&2
            exit 1
          fi
          if [ ! -f read-env-value.sh ]; then
            echo "目标服务器缺少部署 dotenv 读取器。" >&2
            exit 1
          fi
          if [ ! -f create-database-backup.sh ]; then
            echo "目标服务器缺少数据库备份脚本。" >&2
            exit 1
          fi
          if [ ! -f read-release-ledger-digest.sh ]; then
            echo "目标服务器缺少发布门禁账本摘要读取器。" >&2
            exit 1
          fi
          if [ ! -f release-recovery-policy.sh ]; then
            echo "目标服务器缺少发布恢复策略脚本。" >&2
            exit 1
          fi

          # 用受测解析器读取单行 dotenv。
          # 不会 source/eval 配置或打印其他值。
          read_env_value() {
            key="$1"
            bash ./read-env-value.sh .env "${key}"
          }

          # 只更新流水线托管的镜像元数据键。
          set_env_value() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env; then
              sed -i.bak "s|^${key}=.*|${key}=${value}|" .env
              rm -f .env.bak
            else
              printf '%s=%s\n' "${key}" "${value}" >> .env
            fi
          }

          # 用本次新 migrator 镜像运行只读数据库门禁。
          run_release_gate() {
            gate="$1"
            expected_ledger_digest="${2:-}"
            if [ -n "${expected_ledger_digest}" ]; then
              docker compose --profile maintenance run --rm --no-deps \
                --interactive=false \
                -e "RELEASE_CREDITS_LEDGER_DIGEST=${expected_ledger_digest}" \
                migrate \
                pnpm --dir packages/database db:release-gate -- "${gate}" \
                </dev/null
            else
              docker compose --profile maintenance run --rm --no-deps \
                --interactive=false migrate \
                pnpm --dir packages/database db:release-gate -- "${gate}" \
                </dev/null
            fi
          }

          # 用本次新 Web 镜像编译旧 parameterMappings/requestTransformScript
          # 经 0075/0077 将生成的脚本，并确认非终态 API 视频已排空。
          # 命令只输出脱敏 JSON 证据。
          run_api_upstream_adapter_preflight() {
            docker compose run --rm --no-deps \
              --interactive=false web \
              node apps/web/scripts/preflight-api-upstream-adapter-migration.mjs \
              </dev/null
          }

          # 旧 schema 输入全部复制为任务对象；0074 已完成时命令是幂等空操作。
          run_video_input_asset_migration() {
            docker compose --profile maintenance run --rm --no-deps \
              --interactive=false migrate \
              node apps/web/scripts/migrate-video-input-assets.mjs migrate \
              --confirm-no-legacy-writers </dev/null
          }

          # 仅在迁移开始前恢复旧镜像元数据；是否重启由退出状态机决定。
          restore_previous_metadata() {
            if [ -n "${previous_image}" ]; then
              set_env_value FLUXMEDIA_IMAGE "${previous_image}"
            fi
            if [ -n "${previous_migrate_image}" ]; then
              set_env_value FLUXMEDIA_MIGRATE_IMAGE "${previous_migrate_image}"
            fi
            if [ -n "${previous_proxy_image}" ]; then
              set_env_value FLUXMEDIA_PROXY_IMAGE "${previous_proxy_image}"
            fi
            if [ -n "${previous_tag}" ]; then
              set_env_value FLUXMEDIA_TAG "${previous_tag}"
            fi
          }

          previous_image="$(read_env_value FLUXMEDIA_IMAGE)"
          previous_migrate_image="$(read_env_value FLUXMEDIA_MIGRATE_IMAGE)"
          previous_proxy_image="$(read_env_value FLUXMEDIA_PROXY_IMAGE)"
          previous_tag="$(read_env_value FLUXMEDIA_TAG)"
          previous_release_available=false
          if [[ "${previous_image}" =~ ^[A-Za-z0-9._/@:-]+$ ]] \
            && [[ "${previous_proxy_image}" =~ ^[A-Za-z0-9._/@:-]+$ ]] \
            && [[ "${previous_tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            previous_release_available=true
            printf 'previous_release=%s:%s\n' \
              "${previous_image}" "${previous_tag}"
          else
            printf 'previous_release=unknown\n'
          fi
          # 停服前先确认当前配置能创建恢复点。未配置 S3 时，备份脚本会使用
          # deploy-path/backups 下的持久化本地目录，不会跳过数据库备份。
          bash ./create-database-backup.sh \
            preflight .env "${deploy_path}" "${image_tag}" "${git_sha}"

          web_stopped=false
          migration_started=false
          deployment_succeeded=false
          previous_web_was_running=false

          # 迁移前允许恢复旧服务；迁移开始后只保持维护状态。
          handle_deployment_exit() {
            status="$?"
            recovery_action="keep-maintenance"
            if [ "${status}" -eq 0 ] || [ "${deployment_succeeded}" = "true" ]; then
              return
            fi

            if ! recovery_action="$(
              bash ./release-recovery-policy.sh \
                "${migration_started}" \
                "${web_stopped}" \
                "${previous_web_was_running}" \
                "${previous_release_available}"
            )"; then
              echo "发布恢复策略执行失败，保持维护状态。" >&2
              recovery_action="keep-maintenance"
            fi

            if [ "${recovery_action}" = "keep-maintenance" ] \
              && [ "${migration_started}" = "true" ]; then
              echo "迁移已开始：保持维护状态，禁止自动启动旧 schema 镜像。" >&2
              docker compose stop --timeout 30 web >/dev/null 2>&1 || true
              return "${status}"
            fi

            restore_previous_metadata
            if [ "${recovery_action}" = "restart-previous" ]; then
              echo "迁移尚未开始，恢复原本运行的上一版 Web 与代理服务。" >&2
              if ! docker compose up -d --no-deps \
                media-upstream-proxy web >/dev/null 2>&1; then
                echo "上一版服务恢复失败，保持维护状态。" >&2
              fi
            elif [ "${recovery_action}" = "keep-maintenance" ] \
              && [ "${web_stopped}" = "true" ]; then
              echo "缺少可证明安全的上一版运行状态，保持维护状态。" >&2
            fi
            return "${status}"
          }
          trap handle_deployment_exit EXIT

          set_env_value FLUXMEDIA_IMAGE "${web_image}"
          set_env_value FLUXMEDIA_MIGRATE_IMAGE "${migrate_image}"
          set_env_value FLUXMEDIA_PROXY_IMAGE "${proxy_image}"
          set_env_value FLUXMEDIA_TAG "${image_tag}"
          docker compose --profile maintenance config --quiet

          if ! docker compose --profile maintenance pull migrate media-upstream-proxy web; then
            exit 1
          fi

          echo "在停服前烟测新 migrator 镜像与纯中转门禁。"
          # tee 同时保留成功输出供后续判断，并在失败退出前回放阻断证据。
          preliminary_preflight="$(
            run_release_gate preflight-early | tee /dev/stderr
          )"
          if printf '%s\n' "${preliminary_preflight}" \
            | grep -qx 'relay_only_column=present'; then
            initial_governance_migration=true
          else
            initial_governance_migration=false
          fi

          echo "进入维护状态并停止旧 Web 服务。"
          if [ -n "$(docker compose ps -q --status running web)" ]; then
            previous_web_was_running=true
          fi
          docker compose stop --timeout 60 web
          web_stopped=true
          if [ -n "$(docker compose ps -q --status running web)" ]; then
            echo "旧 Web 容器仍在运行，拒绝迁移。" >&2
            exit 1
          fi

          run_release_gate drain
          run_release_gate preflight-early
          run_api_upstream_adapter_preflight

          echo "创建迁移前数据库备份并校验最终存储。"
          bash ./create-database-backup.sh \
            create .env "${deploy_path}" "${image_tag}" "${git_sha}"

          install -d -m 700 state
          echo "收编历史视频输入资产。"
          migration_started=true
          run_video_input_asset_migration
          release_preflight="$(
            run_release_gate preflight | tee /dev/stderr
          )"
          release_credits_ledger_digest="$(
            printf '%s\n' "${release_preflight}" \
              | bash ./read-release-ledger-digest.sh
          )"

          echo "执行数据库迁移。"
          # 远程脚本本身从 SSH stdin 读取；迁移容器不得继承 stdin，否则会吞掉后续
          # web 启动与健康检查命令，并让未完成的部署被误判为成功。
          if ! docker compose --profile maintenance run --rm --no-deps \
            --interactive=false migrate </dev/null; then
            echo "数据库迁移失败，保持维护状态等待恢复备份或前向修复。" >&2
            exit 1
          fi

          if [ "${initial_governance_migration}" = "true" ]; then
            run_release_gate \
              postcheck-initial "${release_credits_ledger_digest}"
          else
            run_release_gate postcheck "${release_credits_ledger_digest}"
          fi

          echo "启动 Adobe 代理和 web 服务。"
          if ! docker compose up -d --remove-orphans media-upstream-proxy web; then
            echo "新 Adobe 代理或 Web 启动失败，保持维护状态。" >&2
            exit 1
          fi

          container_id="$(docker compose ps -q web)"
          if [ -z "${container_id}" ]; then
            echo "未找到 web 容器。" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            health_status="$(
              docker inspect --format \
                '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "${container_id}"
            )"
            if [ "${health_status}" = "healthy" ]; then
              echo "web 服务已通过健康检查。"
              web_stopped=false
              deployment_succeeded=true
              printf 'deployment_completed=true\n'
              docker image prune -f --filter "until=168h"
              trap - EXIT
              exit 0
            fi
            if [ "${health_status}" = "unhealthy" ] || [ "${health_status}" = "exited" ]; then
              break
            fi
            echo "等待 web 健康检查：${attempt}/30，当前状态 ${health_status}。"
            sleep 10
          done

          docker compose logs --tail=100 web >&2
          echo "新 Web 健康检查失败，保持维护状态且不启动旧镜像。" >&2
          exit 1
          REMOTE_SCRIPT

          ssh_status="${PIPESTATUS[0]}"
          set -e
          if [ "${ssh_status}" -ne 0 ]; then
            exit "${ssh_status}"
          fi

          # 从远程输出提取最后一个同名安全证据值。
          extract_evidence() {
            key="$1"
            awk -v key="${key}" '
              index($0, key "=") == 1 {
                value = substr($0, length(key) + 2)
              }
              END { print value }
            ' "${result_file}"
          }

          relay_count="$(extract_evidence relay_only_true_count)"
          backup_storage="$(extract_evidence backup_storage)"
          backup_artifact_id="$(extract_evidence backup_artifact_id)"
          backup_artifact_sha256="$(
            extract_evidence backup_artifact_sha256
          )"
          backup_delete_after="$(extract_evidence backup_delete_after)"
          backup_archive_manifest_verified="$(
            extract_evidence backup_archive_manifest_verified
          )"
          backup_storage_verified="$(
            extract_evidence backup_storage_verified
          )"
          deployment_completed="$(extract_evidence deployment_completed)"
          previous_release="$(extract_evidence previous_release)"
          if [ "${relay_count}" != "0" ] \
            || { [ "${backup_storage}" != "local" ] \
              && [ "${backup_storage}" != "s3" ]; } \
            || [ -z "${backup_artifact_id}" ] \
            || [[ ! "${backup_artifact_sha256}" =~ ^[a-f0-9]{64}$ ]] \
            || [ -z "${backup_delete_after}" ] \
            || [ "${backup_archive_manifest_verified}" != "true" ] \
            || [ "${backup_storage_verified}" != "true" ] \
            || [ "${deployment_completed}" != "true" ]; then
            echo "::error::部署完成但安全证据不完整。"
            exit 1
          fi

          {
            echo "relay_count=${relay_count}"
            echo "backup_storage=${backup_storage}"
            echo "backup_artifact_id=${backup_artifact_id}"
            echo "backup_artifact_sha256=${backup_artifact_sha256}"
            echo "backup_delete_after=${backup_delete_after}"
            printf 'backup_archive_manifest_verified=%s\n' \
              "${backup_archive_manifest_verified}"
            printf 'backup_storage_verified=%s\n' \
              "${backup_storage_verified}"
            echo "previous_release=${previous_release}"
          } >> "${GITHUB_OUTPUT}"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## FluxMedia 生产部署"
            echo ""
            echo "- Web 镜像：\`${WEB_IMAGE}:${IMAGE_TAG}\`"
            echo "- Migrate 镜像：\`${MIGRATE_IMAGE}:${IMAGE_TAG}\`"
            echo "- 域名：\`${PUBLIC_APP_URL}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 迁移前版本：\`${{ steps.deploy.outputs.previous_release }}\`"
            echo "- 服务：\`web\`（未启动注册机）"
            echo "- 纯中转预检：\`${{ steps.deploy.outputs.relay_count }}\`"
            echo "- 备份存储：\`${{ steps.deploy.outputs.backup_storage }}\`"
            echo "- 备份 artifact：\`${{ steps.deploy.outputs.backup_artifact_id }}\`"
            echo "- 备份 artifact SHA-256：\`${{ steps.deploy.outputs.backup_artifact_sha256 }}\`"
            echo "- 备份销毁截止：\`${{ steps.deploy.outputs.backup_delete_after }}\`"
            echo "- archive manifest 校验：" \
              "\`${{ steps.deploy.outputs.backup_archive_manifest_verified }}\`"
            echo "- 最终存储摘要校验：" \
              "\`${{ steps.deploy.outputs.backup_storage_verified }}\`"
            echo "- 操作者：\`${GITHUB_ACTOR}\`"
            echo "- 回滚边界：迁移后失败保持维护状态，不自动启动旧镜像"
          } >> "${GITHUB_STEP_SUMMARY}"
