# ─────────────────────────────────────────────────────────────────────────────
# CI 流水线（持续集成）
#
# 目的：在代码合入前对「协作者 / PR 贡献者」的提交做强制门禁，覆盖代码风格、类型安全、
#       测试、可构建和容器可打包。
#
# 触发：
#   - pull_request → main：贡献者门禁的主战场（每个 check 都会显示在 PR 上）。
#   - 手动 (workflow_dispatch)：需要时人工重跑。
#
# 设计原则：
#   - 每个关注点拆成独立 job，PR 的 Checks 面板上一目了然，便于设为「必须通过(required)」。
#   - 风格检查只针对「本次改动的文件」(biome --changed)，既约束新代码，又不强迫为历史
#     遗留格式问题做一次性全仓重排（仓库当前未全量 biome 格式化，全量 ci 会误伤）。
#   - 类型检查 / 测试为全仓门禁（仓库当前已全绿，可硬性强制）。
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/PR 的新提交会取消仍在跑的旧流水线，节省额度、加快反馈。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只读仓库内容；不授予写权限（发版交给 release.yml，生产部署交给 deploy-production.yml）。
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1) 代码风格 / Lint（仅 PR、仅改动文件）：Biome 对本次 PR 触及的文件执行 lint。
  #
  #    设计取舍（均经验证，见 docs/CI-CD.md）：
  #    - 用 `biome lint`（仅 lint）而非 `biome ci`（lint + 格式 + import 排序）：
  #      本仓库历史代码从未做过全仓 biome 格式化（全仓 `biome ci` 有 300+ 格式报错），
  #      团队既有约定 `turbo lint` 即 `biome lint`。强制格式会误伤大量历史文件。
  #    - 仅在 `pull_request` 触发：贡献者门禁的精确位置是 PR，diff = PR 相对目标分支的净改动（小而准）。
  #      类型/测试/构建在 PR 上运行，合并后不再因 push 到 main 重复执行。
  lint:
    name: Lint & format (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # fetch-depth: 0 拉取完整历史，否则 --since 的基准提交可能不在浅克隆里。
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA 防 tag 重指向；dependabot 维护）
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # PR 场景的 diff 基准即目标分支的 base.sha（GitHub 保证存在且可达）。
      - name: Resolve diff base
        id: base
        run: echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

      # 直接调用仓库锁定的 Biome 版本（apps/web 的依赖，2.3.11），cwd=仓库根，
      # 保证与开发者本地 `biome lint` 完全同款行为；--changed 仅查相对 base 改动的文件。
      # --no-errors-on-unmatched：纯文档类 PR（无 JS/TS 改动）不应判失败。
      # 退出码：有 lint 错误（如 noExplicitAny / noUnusedImports）即失败；
      #         告警级规则（如 noNonNullAssertion=warn）不阻断（与本地一致）。
      - name: Biome lint (changed files only)
        run: |
          ./apps/web/node_modules/.bin/biome lint \
            --changed --since="${{ steps.base.outputs.base }}" \
            --no-errors-on-unmatched \
            .

  # ───────────────────────────────────────────────────────────────────────────
  # 2) 类型检查（鲁棒性）：全仓 strict tsc --noEmit。
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA 防 tag 重指向；dependabot 维护）
      - uses: ./.github/actions/setup
      # 生成 Fumadocs 的 `.source`（.gitignore 忽略、由 fumadocs-mdx Vite 插件在 build/dev 时产出）。
      # 独立 `tsc --noEmit` 不会触发该产出，缺失会导致 src/lib/source.ts 找不到 .source，
      # 引发一连串隐式 any 报错。build 任务走 vite build 会自生成，故仅 typecheck 需要这一步。
      - name: Generate Fumadocs source
        run: pnpm --filter @repo/web exec fumadocs-mdx
      - run: pnpm turbo typecheck

  # ───────────────────────────────────────────────────────────────────────────
  # 3) 单元测试（鲁棒性）：全仓 vitest（DB-free）。覆盖积分/扣费/幂等/API 等核心逻辑。
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA 防 tag 重指向；dependabot 维护）
      - uses: ./.github/actions/setup
      - name: Test development environment selection
        run: node --test scripts/with-root-env.test.mjs
      - run: pnpm turbo test

  # 统一媒体号池与媒体 MQ 的真实 PostgreSQL/Redis 门禁独立于 DB-free 单测运行。
  media-integration:
    name: Media PostgreSQL and Redis integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fluxmedia_media_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluxmedia_media_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_media_test
      IMAGE_BACKEND_POOL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_media_test
      # Go 集成后端与媒体 MQ 只接受带密码的本机 Redis，与 release.yml 的 quality 门禁一致。
      GO_BACKEND_TEST_REDIS_URL: redis://:fluxmedia-ci-redis-secret@127.0.0.1:6379/14
      MEDIA_TASK_MQ_TEST_REDIS_URL: redis://:fluxmedia-ci-redis-secret@127.0.0.1:6379/15
      MEDIA_BACKEND_POOL_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_media_test
      MEDIA_GENERATION_FINANCIAL_RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_media_test
      VIDEO_GENERATION_RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fluxmedia_media_test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA 防 tag 重指向；dependabot 维护）
      - uses: ./.github/actions/setup
      # 积分恢复用例会以 `go run .` 启动真实 Go 后端。
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: services/api-gateway/go.sum
      - name: Configure authenticated Redis
        run: >-
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass
          fluxmedia-ci-redis-secret
      # 预热 Go 编译缓存：用例在 20s 的 beforeAll 内 `go run .`，冷编译会超时。
      - name: Prebuild Go backend
        run: go -C services/api-gateway build -o /dev/null .
      - name: Test unified media pool and MQ
        run: |
          set -euo pipefail
          pnpm --filter @repo/integration-tests test:image-backend-pool
          pnpm --filter @repo/integration-tests test:media-generation-financial-recovery
          pnpm --filter @repo/integration-tests test:video-generation-recovery
          pnpm --filter @repo/integration-tests test:media-backend-pool-migration
          pnpm --filter @repo/integration-tests test:media-task-mq

  # ───────────────────────────────────────────────────────────────────────────
  # 4) 构建（鲁棒性）：vite build 产出 Go 内嵌的 Web SPA，能抓到仅在生产打包下暴露的
  #    问题。公开变量为占位值，与 Dockerfile.unified 的 build-args 一致；SPA 构建不读取机密。
  #    注意：此处不设 NODE_ENV=production，否则 pnpm 可能跳过 devDependencies 导致构建失败。
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: FluxMedia
      NEXT_PUBLIC_PAYMENT_PROVIDER: none
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA 防 tag 重指向；dependabot 维护）
      - uses: ./.github/actions/setup
      - run: |
          set -euo pipefail
          pnpm turbo build --filter=@repo/web
          test -f apps/web/dist/index.html
          pnpm --filter @repo/web smoke:api-upstream-worker

  # ───────────────────────────────────────────────────────────────────────────
  # 5) 容器构建校验（仅 PR）：用 Dockerfile.unified 实打实构建统一应用镜像但**不推送**，
  #    验证多阶段 Dockerfile（turbo prune → SPA 构建 → Go 内嵌编译 → runner 自检）未损坏。
  #    gha 缓存让重复构建保持快速。门禁在前 4 个 job 通过后才跑，避免无谓消耗。
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA 防 tag 重指向；dependabot 维护）
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build unified image (validation only)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.unified
          target: runner
          platforms: linux/amd64
          push: false # 仅校验可构建性；推送由 release.yml 负责
          tags: fluxmedia-unified:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_APP_NAME=FluxMedia
            NEXT_PUBLIC_PAYMENT_PROVIDER=none
          cache-from: type=gha,scope=unified-ci
          cache-to: type=gha,mode=max,scope=unified-ci
