name: gpt2image-pro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt2image}
      POSTGRES_USER: ${POSTGRES_USER:-gpt2image}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gpt2image} -d ${POSTGRES_DB:-gpt2image}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis 承载共享缓存和带 TTL 的生图并发槽；Web 启动前必须通过健康检查。
  # 生产应使用高可用 Redis，避免服务重启期间丢失尚未到期的临时槽位租约。
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/meowfree/gpt2image-pro-migrate:${GPT2IMAGE_IMAGE_TAG:-latest}
    env_file:
      - ${GPT2IMAGE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpt2image}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gpt2image}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-4}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ghcr.io/meowfree/gpt2image-pro-web:${GPT2IMAGE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${GPT2IMAGE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpt2image}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gpt2image}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-4}
      # 鉴权必填:未配置会导致所有人(含超管)登录失败,务必先在 env 文件中设置。
      # BETTER_AUTH_SECRET: 会话/Cookie 签名密钥(随机长字符串,如 `openssl rand -base64 32`)。
      # BETTER_AUTH_URL: 站点对外访问地址(如 https://your-domain),须与浏览器实际访问的域名一致,
      #   否则登录回调/Cookie 域不匹配,超管也进不去。
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填:会话签名密钥,未设置将无法登录}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL 必填:须为站点公网访问地址(如 https://your-domain),否则登录失败}
      LOCAL_STORAGE_PATH: /app/storage
      ADOBE_DIRECT_PROXY_URL: ${ADOBE_DIRECT_PROXY_URL:-http://media-upstream-proxy:3021}
      ADOBE_DIRECT_PROXY_SECRET: ${ADOBE_DIRECT_PROXY_SECRET:?ADOBE_DIRECT_PROXY_SECRET is required}
      ADOBE_DIRECT_PROXY_TIMEOUT_SECONDS: ${ADOBE_DIRECT_PROXY_TIMEOUT_SECONDS:-300}
      ADOBE_DIRECT_PROXY_MAX_BODY_MB: ${ADOBE_DIRECT_PROXY_MAX_BODY_MB:-64}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      media-upstream-proxy:
        condition: service_healthy

  # Adobe direct 专用 TLS 转发器：只允许精确 Adobe HTTPS 主机，不持有数据库凭据。
  media-upstream-proxy:
    image: ghcr.io/meowfree/gpt2image-pro-media-upstream-proxy:${GPT2IMAGE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ADOBE_DIRECT_PROXY_SECRET: ${ADOBE_DIRECT_PROXY_SECRET:?ADOBE_DIRECT_PROXY_SECRET is required}
      ADOBE_DIRECT_PROXY_TIMEOUT_SECONDS: ${ADOBE_DIRECT_PROXY_TIMEOUT_SECONDS:-300}
      ADOBE_DIRECT_PROXY_MAX_BODY_MB: ${ADOBE_DIRECT_PROXY_MAX_BODY_MB:-64}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header='X-Proxy-Secret: '$${ADOBE_DIRECT_PROXY_SECRET} http://127.0.0.1:3021/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 影子流量 relay 默认不启动。启用后，调用方把明确允许的内网 JSON 请求发给它；
  # relay 同步转发生产端，异步投递 A/B 评估端。两个目标与密钥均由部署环境固定配置。
  ab-shadow-relay:
    profiles:
      - ab-shadow
    build:
      context: .
      dockerfile: Dockerfile.ab-shadow-relay
    restart: unless-stopped
    environment:
      AB_RELAY_BIND: :3030
      AB_RELAY_PRODUCTION_URL: ${AB_RELAY_PRODUCTION_URL:-}
      AB_RELAY_SHADOW_URL: ${AB_RELAY_SHADOW_URL:-}
      AB_RELAY_INBOUND_SECRET: ${AB_RELAY_INBOUND_SECRET:-}
      AB_RELAY_SHADOW_SECRET: ${AB_RELAY_SHADOW_SECRET:-}
      AB_RELAY_ALLOWED_PATHS: ${AB_RELAY_ALLOWED_PATHS:-}
      AB_RELAY_ALLOWED_METHODS: ${AB_RELAY_ALLOWED_METHODS:-}
      AB_RELAY_TIMEOUT_MS: ${AB_RELAY_TIMEOUT_MS:-5000}
      AB_RELAY_MAX_BODY_BYTES: ${AB_RELAY_MAX_BODY_BYTES:-1048576}
      AB_RELAY_MAX_IN_FLIGHT_SHADOWS: ${AB_RELAY_MAX_IN_FLIGHT_SHADOWS:-32}
    ports:
      - "127.0.0.1:${AB_RELAY_PORT:-3030}:3030"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  app-storage:
