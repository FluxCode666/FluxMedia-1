name: gpt2image-pro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt2image}
      POSTGRES_USER: ${POSTGRES_USER:-gpt2image}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gpt2image} -d ${POSTGRES_DB:-gpt2image}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis 承载 BullMQ、共享缓存和生图并发槽；PostgreSQL 仍是任务与财务真相。
  # noeviction 避免 MQ 键在内存压力下被逐出，AOF 与命名卷缩短重启后的补投窗口。
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/meowfree/gpt2image-pro-web:${GPT2IMAGE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${GPT2IMAGE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpt2image}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gpt2image}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-4}
      REDIS_TLS: "false"
      MEDIA_IMAGE_WORKER_CONCURRENCY: ${MEDIA_IMAGE_WORKER_CONCURRENCY:-4}
      MEDIA_VIDEO_WORKER_CONCURRENCY: ${MEDIA_VIDEO_WORKER_CONCURRENCY:-4}
      # 鉴权必填:未配置会导致所有人(含超管)登录失败,务必先在 env 文件中设置。
      # BETTER_AUTH_SECRET: 会话/Cookie 签名密钥(随机长字符串,如 `openssl rand -base64 32`)。
      # BETTER_AUTH_URL: 站点对外访问地址(如 https://your-domain),须与浏览器实际访问的域名一致,
      #   否则登录回调/Cookie 域不匹配,超管也进不去。
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填:会话签名密钥,未设置将无法登录}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL 必填:须为站点公网访问地址(如 https://your-domain),否则登录失败}
      GO_BACKEND_URL: ${GO_BACKEND_URL:-http://backend:8080}
      LOCAL_STORAGE_PATH: /app/storage
    expose:
      - "3000"
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Go backend 统一持有 PostgreSQL/Redis；数据库迁移在 entrypoint 内执行。
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    restart: unless-stopped
    env_file:
      - ${GPT2IMAGE_ENV_FILE:-.env}
    environment:
      GO_BACKEND_BIND: :8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpt2image}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gpt2image}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-4}
      REDIS_TLS: "false"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      TZ: UTC
      GO_BACKEND_MAX_BODY_BYTES: ${GO_BACKEND_MAX_BODY_BYTES:-104857600}
      GO_BACKEND_WRITE_TIMEOUT_MS: ${GO_BACKEND_WRITE_TIMEOUT_MS:-3600000}
      GO_SCRIPT_RUNTIME_URL: ${GO_SCRIPT_RUNTIME_URL:-http://script-runtime:8090}
      GO_SCRIPT_RUNTIME_TOKEN: ${GO_SCRIPT_RUNTIME_TOKEN:-}
    ports:
      - "${GO_BACKEND_PORT:-3000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      script-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/backend", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # 仅供 Go backend 使用的 JavaScript/QuickJS 脚本运行时。没有宿主机端口，不能被浏览器
  # 或公网直接访问；Go 在外呼前后负责所有鉴权、媒体令牌和供应商协议校验。
  script-runtime:
    build:
      context: .
      dockerfile: Dockerfile.api-upstream-script-runtime
    restart: unless-stopped
    environment:
      SCRIPT_RUNTIME_BIND: :8090
      API_UPSTREAM_SCRIPT_WORKER_COUNT: ${API_UPSTREAM_SCRIPT_WORKER_COUNT:-1}
      API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB: ${API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB:-32}
      API_UPSTREAM_SCRIPT_STACK_LIMIT_KB: ${API_UPSTREAM_SCRIPT_STACK_LIMIT_KB:-512}
      SCRIPT_RUNTIME_TOKEN: ${GO_SCRIPT_RUNTIME_TOKEN:-}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # 影子流量 relay 默认不启动。启用后，调用方把明确允许的内网 JSON 请求发给它；
  # relay 同步转发生产端，异步投递 A/B 评估端。两个目标与密钥均由部署环境固定配置。
  ab-shadow-relay:
    profiles:
      - ab-shadow
    build:
      context: .
      dockerfile: Dockerfile.ab-shadow-relay
    restart: unless-stopped
    environment:
      AB_RELAY_BIND: :3030
      AB_RELAY_PRODUCTION_URL: ${AB_RELAY_PRODUCTION_URL:-}
      AB_RELAY_SHADOW_URL: ${AB_RELAY_SHADOW_URL:-}
      AB_RELAY_INBOUND_SECRET: ${AB_RELAY_INBOUND_SECRET:-}
      AB_RELAY_SHADOW_SECRET: ${AB_RELAY_SHADOW_SECRET:-}
      AB_RELAY_ALLOWED_PATHS: ${AB_RELAY_ALLOWED_PATHS:-}
      AB_RELAY_ALLOWED_METHODS: ${AB_RELAY_ALLOWED_METHODS:-}
      AB_RELAY_TIMEOUT_MS: ${AB_RELAY_TIMEOUT_MS:-5000}
      AB_RELAY_MAX_BODY_BYTES: ${AB_RELAY_MAX_BODY_BYTES:-1048576}
      AB_RELAY_MAX_IN_FLIGHT_SHADOWS: ${AB_RELAY_MAX_IN_FLIGHT_SHADOWS:-32}
    ports:
      - "127.0.0.1:${AB_RELAY_PORT:-3030}:3030"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
  app-storage:
