# FluxMedia 生产 Compose：运行 Next.js 主服务。
# PostgreSQL、Redis 与其他可选上游均为外部依赖。
name: fluxmedia

services:
  # 数据库迁移是一次性维护任务，默认 profile 不启用，普通 up 只启动 web。
  migrate:
    profiles:
      - maintenance
    image: ${FLUXMEDIA_MIGRATE_IMAGE:-ghcr.io/fluxcode666/fluxmedia-1-migrate}:${FLUXMEDIA_TAG:?FLUXMEDIA_TAG 必填}
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必填}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      LOCAL_STORAGE_PATH: /app/storage
      NODE_ENV: production
      TZ: UTC
      VIDEO_INPUT_ROLLBACK_MANIFEST: /app/deploy-state/video-input-rollback-${FLUXMEDIA_TAG:?FLUXMEDIA_TAG 必填}.ndjson
    volumes:
      - app-storage:/app/storage
      - ./state:/app/deploy-state

  web:
    image: ${FLUXMEDIA_IMAGE:-ghcr.io/fluxcode666/fluxmedia-1-web}:${FLUXMEDIA_TAG:?FLUXMEDIA_TAG 必填}
    restart: unless-stopped
    init: true
    networks:
      - flux-code
      - infra
    env_file:
      - .env
    # 每个 web 容器只运行一个 Node 主进程；下列 Worker Thread 数按
    # Node 进程计算，水平扩容 web 副本时容量会随副本数线性增加。
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必填}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://media.flux-code.cc}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://media.flux-code.cc}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      LOCAL_STORAGE_PATH: /app/storage
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST 必填}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必填}
      REDIS_DB: ${REDIS_DB:-4}
      REDIS_TLS: ${REDIS_TLS:-false}
      # pg 按进程 TZ 解析无时区 timestamp；展示时区只能通过 APP_TIME_ZONE 配置。
      TZ: UTC
      API_UPSTREAM_SCRIPT_WORKER_COUNT: ${API_UPSTREAM_SCRIPT_WORKER_COUNT:-1}
      API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB: ${API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB:-32}
      API_UPSTREAM_SCRIPT_STACK_LIMIT_KB: ${API_UPSTREAM_SCRIPT_STACK_LIMIT_KB:-512}
      MEDIA_IMAGE_WORKER_CONCURRENCY: ${MEDIA_IMAGE_WORKER_CONCURRENCY:-4}
      MEDIA_VIDEO_WORKER_CONCURRENCY: ${MEDIA_VIDEO_WORKER_CONCURRENCY:-4}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  app-storage:

networks:
  infra:
    external: true
    name: infra_default
  flux-code:
    external: true
    name: flux-code
