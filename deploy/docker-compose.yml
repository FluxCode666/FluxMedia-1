# FluxMedia 生产 Compose：一个应用容器运行 Web、Go 与两个内部运行时。
# PostgreSQL、Redis 与其他可选上游均为外部依赖。
name: fluxmedia

services:
  app:
    platform: linux/amd64
    image: ${FLUXMEDIA_APP_IMAGE_REF:?FLUXMEDIA_APP_IMAGE_REF 必填且必须包含 digest}
    restart: unless-stopped
    init: true
    networks:
      # 与共享 PostgreSQL/Redis 基础设施复用同一个已存在的 Docker 网络。
      - infra
    # Keep credentials byte-for-byte intact. Compose interpolation would treat
    # `$NAME` in a password as a variable reference before the process starts.
    env_file:
      - path: .env
        format: raw
    environment:
      # DATABASE_URL, BETTER_AUTH_SECRET and REDIS_PASSWORD intentionally come
      # only from the raw env file so `$` in credentials is never interpolated.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://media.flux-code.cc}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://media.flux-code.cc}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      # 固定回环地址，避免旧 .env 中的多容器 DNS 值覆盖统一容器拓扑。
      GO_BACKEND_URL: http://127.0.0.1:8080
      GO_BACKEND_BIND: :8080
      GO_BACKEND_SKIP_MIGRATION: "true"
      GO_BACKEND_MAX_BODY_BYTES: ${GO_BACKEND_MAX_BODY_BYTES:-104857600}
      GO_BACKEND_WRITE_TIMEOUT_MS: ${GO_BACKEND_WRITE_TIMEOUT_MS:-3600000}
      GO_BACKEND_READ_TIMEOUT_MS: ${GO_BACKEND_READ_TIMEOUT_MS:-30000}
      GO_BACKEND_IDLE_TIMEOUT_MS: ${GO_BACKEND_IDLE_TIMEOUT_MS:-75000}
      GO_SCRIPT_RUNTIME_URL: http://127.0.0.1:8090
      GO_MEDIA_PROCESSING_URL: http://127.0.0.1:8091
      SCRIPT_RUNTIME_BIND: :8090
      SCRIPT_RUNTIME_HOST: 127.0.0.1
      MEDIA_PROCESSING_HOST: 127.0.0.1
      MEDIA_PROCESSING_PORT: "8091"
      MEDIA_PROCESSING_MODELS_PATH: /app/apps/web/models
      LOCAL_STORAGE_PATH: /app/storage
      # pg 按进程 TZ 解析无时区 timestamp；展示时区只由 APP_TIME_ZONE 配置。
      TZ: UTC
      API_UPSTREAM_SCRIPT_WORKER_COUNT: ${API_UPSTREAM_SCRIPT_WORKER_COUNT:-1}
      API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB: ${API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB:-32}
      API_UPSTREAM_SCRIPT_STACK_LIMIT_KB: ${API_UPSTREAM_SCRIPT_STACK_LIMIT_KB:-512}
      MEDIA_IMAGE_WORKER_CONCURRENCY: ${MEDIA_IMAGE_WORKER_CONCURRENCY:-4}
      MEDIA_VIDEO_WORKER_CONCURRENCY: ${MEDIA_VIDEO_WORKER_CONCURRENCY:-4}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
      - "${BIND_HOST:-127.0.0.1}:${GO_BACKEND_PORT:-3001}:8080"
    volumes:
      - /root/docker-data/fluxmedia:/app/storage
    healthcheck:
      test: ["CMD", "node", "/app/services/unified-runtime/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  infra:
    external: true
    name: infra_default
