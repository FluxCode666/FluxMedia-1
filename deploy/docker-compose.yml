# FluxMedia 生产 Compose：运行 Go 网关与 Next.js 业务服务。
# PostgreSQL、Redis 与其他可选上游均为外部依赖。
name: fluxmedia

services:
  web:
    image: ${FLUXMEDIA_IMAGE:-ghcr.io/fluxcode666/fluxmedia-1-web}:${FLUXMEDIA_TAG:?FLUXMEDIA_TAG 必填}
    restart: unless-stopped
    init: true
    networks:
      # 与共享 PostgreSQL/Redis 基础设施复用同一个已存在的 Docker 网络。
      - infra
    env_file:
      - .env
    # 每个 web 容器只运行一个 Node 主进程；下列 Worker Thread 数按
    # Node 进程计算，水平扩容 web 副本时容量会随副本数线性增加。
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必填}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://media.flux-code.cc}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://media.flux-code.cc}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      LOCAL_STORAGE_PATH: /app/storage
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST 必填}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必填}
      REDIS_DB: ${REDIS_DB:-4}
      REDIS_TLS: ${REDIS_TLS:-false}
      # pg 按进程 TZ 解析无时区 timestamp；展示时区只能通过 APP_TIME_ZONE 配置。
      TZ: UTC
      API_UPSTREAM_SCRIPT_WORKER_COUNT: ${API_UPSTREAM_SCRIPT_WORKER_COUNT:-1}
      API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB: ${API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB:-32}
      API_UPSTREAM_SCRIPT_STACK_LIMIT_KB: ${API_UPSTREAM_SCRIPT_STACK_LIMIT_KB:-512}
      MEDIA_IMAGE_WORKER_CONCURRENCY: ${MEDIA_IMAGE_WORKER_CONCURRENCY:-4}
      MEDIA_VIDEO_WORKER_CONCURRENCY: ${MEDIA_VIDEO_WORKER_CONCURRENCY:-4}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - /root/docker-data/fluxmedia:/app/storage
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # Go backend 是生产公网入口，并在同一容器 entrypoint 内执行数据库迁移。
  backend:
    image: ${FLUXMEDIA_BACKEND_IMAGE:-ghcr.io/fluxcode666/fluxmedia-1-backend}:${FLUXMEDIA_TAG:?FLUXMEDIA_TAG 必填}
    restart: unless-stopped
    init: true
    networks:
      - infra
    env_file:
      - .env
    environment:
      GO_BACKEND_BIND: :8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://media.flux-code.cc}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必填}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST 必填}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必填}
      REDIS_DB: ${REDIS_DB:-4}
      REDIS_TLS: ${REDIS_TLS:-true}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      TZ: UTC
      GO_BACKEND_SKIP_MIGRATION: ${GO_BACKEND_SKIP_MIGRATION:-false}
      GO_BACKEND_MAX_BODY_BYTES: ${GO_BACKEND_MAX_BODY_BYTES:-104857600}
      GO_BACKEND_WRITE_TIMEOUT_MS: ${GO_BACKEND_WRITE_TIMEOUT_MS:-3600000}
      GO_BACKEND_READ_TIMEOUT_MS: ${GO_BACKEND_READ_TIMEOUT_MS:-30000}
      GO_BACKEND_IDLE_TIMEOUT_MS: ${GO_BACKEND_IDLE_TIMEOUT_MS:-75000}
      GO_SCRIPT_RUNTIME_URL: ${GO_SCRIPT_RUNTIME_URL:-http://script-runtime:8090}
      GO_SCRIPT_RUNTIME_TOKEN: ${GO_SCRIPT_RUNTIME_TOKEN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GO_BACKEND_PORT:-3001}:8080"
    healthcheck:
      test: ["CMD", "/backend", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      script-runtime:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # 私有 QuickJS 运行时，仅接受 backend 的内部请求，不发布宿主机端口。
  script-runtime:
    image: ${FLUXMEDIA_SCRIPT_RUNTIME_IMAGE:-ghcr.io/fluxcode666/fluxmedia-1-script-runtime}:${FLUXMEDIA_TAG:?FLUXMEDIA_TAG 必填}
    restart: unless-stopped
    init: true
    networks:
      - infra
    env_file:
      - .env
    environment:
      SCRIPT_RUNTIME_BIND: :8090
      API_UPSTREAM_SCRIPT_WORKER_COUNT: ${API_UPSTREAM_SCRIPT_WORKER_COUNT:-1}
      API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB: ${API_UPSTREAM_SCRIPT_MEMORY_LIMIT_MB:-32}
      API_UPSTREAM_SCRIPT_STACK_LIMIT_KB: ${API_UPSTREAM_SCRIPT_STACK_LIMIT_KB:-512}
      SCRIPT_RUNTIME_TOKEN: ${GO_SCRIPT_RUNTIME_TOKEN:-}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

networks:
  infra:
    external: true
    name: infra_default
